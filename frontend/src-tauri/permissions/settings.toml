[[permission]]
identifier = "allow-settings-read"
description = "Allows reading the shared Coda settings file."
commands.allow = ["settings_read"]

[[permission]]
identifier = "allow-settings-write"
description = "Allows writing the shared Coda settings file."
commands.allow = ["settings_write"]

[[permission]]
identifier = "allow-settings-patch"
description = "Allows atomic field updates to the shared Coda settings file."
commands.allow = ["settings_patch"]
