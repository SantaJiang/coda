name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Force packaging even when only the patch version changed
        type: boolean
        default: false

# Tests stay local (`bun run test`). This workflow only compiles and packs.
permissions:
  contents: write

jobs:
  gate:
    name: Check minor version
    runs-on: ubuntu-22.04
    outputs:
      should_pack: ${{ steps.check.outputs.should_pack }}
      version: ${{ steps.check.outputs.version }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        env:
          FORCE_PACK: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: bash ./scripts/ci-should-pack.sh
      - name: Decision
        run: echo "${{ steps.check.outputs.reason }}"
      # Release assets do not consume the account's Actions artifact quota.
      # Keep a new release in draft until every platform has uploaded its installer.
      - name: Prepare release
        if: steps.check.outputs.should_pack == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
              --title "Coda $VERSION" --generate-notes
          fi

  pack:
    name: Pack ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.should_pack == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: macOS Apple Silicon
            # macos-14 已于 2026-11-02 退役；arm64 继续用 macos-15。
            os: macos-15
            bundles: dmg
          - name: Linux deb
            os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # Patch reconstruction compares source bytes with git blobs (LF).
      # Apply this before both the parent checkout and submodule checkout.
      - name: Preserve LF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # GITHUB_TOKEN is scoped to this repo. Fetch the public backend
      # submodule without it, otherwise GitHub treats the request as
      # authenticated and rejects the other repository.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout backend submodule
        run: |
          set -euo pipefail
          git submodule sync --recursive
          if ! git submodule update --init --recursive --force; then
            sha="$(git rev-parse HEAD:backend)"
            echo "::error::backend gitlink $sha 在 SantaJiang/coda-backend 上不存在或不可达。"
            echo "本地在推父仓库前请运行: bash ./scripts/sync-backend-mirror.sh"
            echo "或安装 hook: bash ./scripts/install-hooks.sh （推送时自动同步）"
            exit 128
          fi

      - name: Add Git Bash to PATH
        if: runner.os == 'Windows'
        run: echo "C:/Program Files/Git/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: backend/package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        env:
          PACK_BUNDLES: ${{ matrix.bundles }}
          # Optional Developer ID credentials. Without them the app is ad-hoc
          # signed through tauri.conf.json, which still binds Info.plist.
          CODA_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CODA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CODA_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CODA_APPLE_ID: ${{ secrets.APPLE_ID }}
          CODA_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          CODA_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CODA_APPLE_CERTIFICATE:-}" ]]; then
            export APPLE_CERTIFICATE="$CODA_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$CODA_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$CODA_APPLE_SIGNING_IDENTITY"
            export APPLE_ID="$CODA_APPLE_ID"
            export APPLE_PASSWORD="$CODA_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$CODA_APPLE_TEAM_ID"
          fi
          bash ./scripts/pack.sh

      - name: Build installers
        if: runner.os != 'macOS'
        env:
          PACK_BUNDLES: ${{ matrix.bundles }}
        run: bash ./scripts/pack.sh

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find frontend/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No installers found"
            exit 1
          fi
          gh release upload "v$VERSION" "${files[@]}" --clobber

  release:
    name: GitHub Release
    needs: [gate, pack]
    if: needs.gate.outputs.should_pack == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish release after all installers are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
